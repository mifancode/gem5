<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstRegTrace Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:13px/1.35 ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; background:#13131d; color:#e6e6e6; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

#ctl { background:#181826; padding:7px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #24243a; flex-shrink:0; z-index:2; }
#ctl label.btn { background:#202038; color:#e6e6e6; border:1px solid #2d2d4b; padding:5px 10px; border-radius:6px; cursor:pointer; font:inherit; display:inline-block; transition:background .12s,border-color .12s; }
#ctl label.btn:hover { background:#2b2b52; border-color:#3d3d6a; }
#ctl button, #ctl select, #ctl input[type="text"] { background:#202038; color:#e6e6e6; border:1px solid #2d2d4b; padding:5px 10px; border-radius:6px; cursor:pointer; font:inherit; transition:background .12s,border-color .12s; }
#ctl button:hover { background:#2b2b52; border-color:#3d3d6a; }
#ctl input[type="range"] { accent-color:#4d9fff; cursor:pointer; }
#ctl .sep { width:1px; height:18px; background:#24243a; margin:0 2px; }
#ctl label.lbl { color:#8b93ab; font-size:11px; }
#ctl #stats { margin-left:auto; color:#5fd6a6; font-size:11px; white-space:nowrap; }
#drop-zone { position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(77,159,255,0.07); border:3px dashed #4d9fff; display:flex; align-items:center; justify-content:center; font-size:18px; color:#4d9fff; z-index:99; pointer-events:none; opacity:0; transition:opacity 0.15s; }
#drop-zone.show { opacity:1; }

#main { display:flex; flex:1; overflow:hidden; min-height:0; }
#inst-panel { flex:1; overflow:hidden; display:flex; flex-direction:column; border-right:1px solid #24243a; min-width:0; }
#right-panel { flex:1; overflow:hidden; display:flex; flex-direction:column; background:#181826; min-width:360px; max-width:760px; }

#inst-hdr { background:#181826; padding:6px 10px; display:grid; grid-template-columns:88px 60px 46px 76px minmax(0,1fr); font-weight:600; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#8b93ab; flex-shrink:0; gap:4px; border-bottom:1px solid #24243a; }
#inst-list { flex:1; overflow-y:auto; overflow-anchor:none; scrollbar-width:thin; scrollbar-color:#34345c transparent; }
#inst-list::-webkit-scrollbar { width:9px; }
#inst-list::-webkit-scrollbar-track { background:transparent; }
#inst-list::-webkit-scrollbar-thumb { background:#2b2b48; border-radius:5px; border:2px solid #13131d; }
#inst-list::-webkit-scrollbar-thumb:hover { background:#3d3d66; }

.inst-row { position:absolute; left:0; right:0; height:24px; display:grid; grid-template-columns:88px 60px 46px 76px minmax(0,1fr); align-items:center; padding:0 10px; border-bottom:1px solid #1e1e31; cursor:pointer; font-size:12px; gap:4px; user-select:none; overflow:hidden; transition:background .1s; }
.list-spacer { position:relative; }
.inst-row:hover { background:#1b1b2c; }
.inst-row.sel { background:#0e2b47; box-shadow:inset 3px 0 0 #4d9fff; }
.tick { color:#f5c34a; }
.pc { color:#55b6f2; }
.seq { color:#9aa3b8; }
.core { color:#9aa3b8; }
.inst-name { color:#e6e6e6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

#right-tabs { display:flex; background:#181826; flex-shrink:0; border-bottom:1px solid #24243a; }
#right-tabs button { flex:1; padding:8px; background:transparent; color:#8b93ab; border:none; border-bottom:2px solid transparent; cursor:pointer; font:inherit; transition:color .15s,border-color .15s; }
#right-tabs button:hover { color:#cfd4e4; }
#right-tabs button.active { color:#e6e6e6; border-bottom-color:#4d9fff; }
#right-content { flex:1; overflow-y:auto; padding:8px; scrollbar-width:thin; scrollbar-color:#34345c transparent; }
#right-content::-webkit-scrollbar { width:9px; }
#right-content::-webkit-scrollbar-thumb { background:#2b2b48; border-radius:5px; border:2px solid #181826; }

#dep-table { width:100%; font-size:11px; }
#dep-table td { padding:4px 6px; vertical-align:top; border-bottom:1px solid #222238; }
.mono { font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; }
.dep-val-box { min-width:340px; max-width:360px; max-height:9em; overflow:auto; white-space:pre; background:#10101d; border:1px solid #24243a; border-radius:6px; padding:3px 5px; font-size:10px; line-height:1.35; }
.dep-val-box::-webkit-scrollbar { width:8px; height:8px; }
.dep-val-box::-webkit-scrollbar-thumb { background:#2b2b48; border-radius:4px; }
.copy-btn { font-size:9px; margin-left:4px; cursor:pointer; background:#202038; color:#e6e6e6; border:1px solid #2d2d4b; border-radius:4px; padding:2px 6px; transition:background .12s; }
.copy-btn:hover { background:#2b2b52; }
#dep-table .dep-src, #dep-table .dep-dst { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; }
#dep-table .dep-src { color:#7db8ff; background:rgba(77,159,255,0.13); border:1px solid rgba(77,159,255,0.28); }
#dep-table .dep-mem { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; color:#5fd6a6; background:rgba(70,200,140,0.12); border:1px solid rgba(70,200,140,0.30); }
#dep-table .dep-dst { color:#ff8f70; background:rgba(255,105,64,0.12); border:1px solid rgba(255,105,64,0.30); }
#dep-table .dep-val { color:#e6e6e6; }
#dep-table .dep-prod { color:#f5c34a; font-size:10px; cursor:pointer; text-decoration:underline; }
#dep-table .dep-prod:hover { color:#fff; }
#dep-table .dep-here { color:#6b7388; font-size:10px; }

#snap-table { width:100%; border-collapse:collapse; font-size:11px; }
#snap-table th { background:#202038; padding:4px 6px; text-align:left; color:#8b93ab; position:sticky; top:0; z-index:1; }
#snap-table td { padding:3px 6px; border-bottom:1px solid #222238; }
.snap-toggle { cursor:pointer; color:#7db8ff; }
.snap-toggle:hover { color:#fff; }
.snap-caret { font-size:9px; color:#8b93ab; }
.snap-src { background:rgba(77,159,255,0.08); }
.snap-dst { background:rgba(255,105,64,0.08); }

#search-box { width:150px; background:#202038; color:#e6e6e6; border:1px solid #2d2d4b; padding:5px 10px; border-radius:6px; font:inherit; }
#search-box:focus { outline:none; border-color:#4d9fff; }
#search-box::placeholder { color:#555d73; }
</style>
</head>
<body>

<div id="ctl">
  <label class="btn" for="file-inp">&#x1F4C2; Open File</label>
  <input type="file" id="file-inp" accept=".jsonl,.json,.txt" style="display:none;">
  <span class="sep"></span>
  <label class="lbl">Thread:</label><select id="thread-sel"><option value="all">All</option></select>
  <input id="search-box" placeholder="filter...">
  <span class="sep"></span>
  <label class="lbl">Tick:</label><input type="range" id="tick-slider" min="0" max="100" value="0" style="width:160px;">
  <span id="tick-label" style="color:#f0c040;font-size:11px;">&mdash;</span>
  <button id="btn-prev" title="Prev">&#9664;</button>
  <button id="btn-next" title="Next">&#9654;</button>
  <span id="stats">Drop .jsonl here or click Open</span>
</div>

<div id="drop-zone">&#x1F4E5; Drop .jsonl file here</div>

<div id="main">
  <div id="inst-panel">
    <div id="inst-hdr"><span>Tick</span><span>Seq</span><span>Core</span><span>PC</span><span>Instruction</span></div>
    <div id="inst-list"></div>
  </div>
  <div id="right-panel">
    <div id="right-tabs">
      <button class="active" data-view="dep">Dependencies</button>
      <button data-view="snapshot">Snapshot</button>
    </div>
    <div id="right-content"><div style="color:#666;padding:20px;text-align:center;">Open a .jsonl trace file</div></div>
  </div>
</div>

<script>
// =================== Data Store ===================
const DS = {
  all: [],
  // Write history per register: regName -> [{ idx, thread, val }, ...]
  // appended in commit order, so idx is monotonically increasing.
  regHistory: new Map(),
  maxTick: 0,
  threads: new Set(),

  add(r) {
    const idx = this.all.length;
    this.all.push(r);
    if (r.tick > this.maxTick) this.maxTick = r.tick;
    if (r.thread !== undefined) this.threads.add(r.thread);

    // Append a write-history entry for each destination register
    if (r.dst) for (let d of r.dst) {
      if (!this.regHistory.has(d.name)) this.regHistory.set(d.name, []);
      this.regHistory.get(d.name).push({ idx: idx, thread: r.thread, val: d.val, size: d.size });
    }
  },

  // Last write of `name` strictly before `idx` on thread `thread`, or null.
  // A RAW dependency requires the producer to execute before the consumer.
  getProducerBefore(name, idx, thread) {
    const hist = this.regHistory.get(name);
    if (!hist) return null;
    // Binary search for the last entry with entry.idx < idx
    let lo = 0, hi = hist.length - 1, res = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (hist[mid].idx < idx) { res = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    // Walk back to the nearest write from the same thread
    for (let i = res; i >= 0; i--) {
      if (hist[i].thread === thread) return hist[i];
    }
    return null;
  },

  // Register file values as of index `idx` on thread `thread`.
  snapshotAt(idx, thread) {
    const m = new Map();
    for (let [name, hist] of this.regHistory) {
      for (let i = hist.length - 1; i >= 0; i--) {
        if (hist[i].idx <= idx && hist[i].thread === thread) {
          m.set(name, { val: hist[i].val, size: hist[i].size });
          break;
        }
      }
    }
    return m;
  }
};

// =================== App State ===================
let state = {
  thread: 'all',
  filter: '',
  selAllIdx: -1,
  view: 'dep'
};

function filtered() {
  let a = DS.all;
  if (state.thread !== 'all') a = a.filter(r => r.thread == state.thread);
  if (state.filter) {
    const f = state.filter.toLowerCase();
    a = a.filter(r => (
      (r.pc||'').toLowerCase().includes(f) ||
      (r.inst||'').toLowerCase().includes(f) ||
      (r.src||[]).some(s => s.name.toLowerCase().includes(f)) ||
      (r.dst||[]).some(d => d.name.toLowerCase().includes(f))
    ));
  }
  return a;
}

function selectedRec() {
  if (state.selAllIdx < 0 || state.selAllIdx >= DS.all.length) return null;
  const r = DS.all[state.selAllIdx];
  const f = filtered();
  return f.includes(r) ? r : null;
}

function jumpToIdx(allIdx) {
  state.selAllIdx = allIdx;
  const r = DS.all[allIdx];
  document.getElementById('tick-slider').value = allIdx;
  document.getElementById('tick-label').textContent = r.tick;
  updateAll();
  // Scroll the selected row into view
  setTimeout(() => {
    const f = filtered();
    const fi = f.indexOf(r);
    if (fi >= 0) {
      const row = document.querySelector(`.inst-row[data-i="${fi}"]`);
      if (row) row.scrollIntoView({ block: 'center' });
    }
  }, 50);
}

// =================== File Load ===================
async function loadFile(file) {
  const t0 = performance.now();
  const text = await file.text();
  const lines = text.trim().split('\n');
  document.getElementById('stats').textContent = `loading 0/${lines.length}`;

  DS.all = []; DS.regHistory = new Map(); DS.maxTick=0; DS.threads=new Set();
  state.selAllIdx = -1;

  const CHUNK = 50000;
  for (let i=0; i<lines.length; i+=CHUNK) {
    const end = Math.min(i+CHUNK, lines.length);
    for (let j=i; j<end; j++) {
      try { DS.add(JSON.parse(lines[j])); } catch(e) {}
    }
    document.getElementById('stats').textContent = `loading ${end}/${lines.length}`;
    await new Promise(r => setTimeout(r, 0));
  }

  const elapsed = ((performance.now()-t0)/1000).toFixed(1);
  document.getElementById('stats').textContent = `${DS.all.length} records (${elapsed}s)`;

  const sel = document.getElementById('thread-sel');
  sel.innerHTML = '<option value="all">All</option>';
  [...DS.threads].sort().forEach(t => { sel.innerHTML += `<option value="${t}">T${t}</option>`; });

  const sl = document.getElementById('tick-slider');
  sl.max = DS.all.length - 1; sl.value = 0;
  if (DS.all.length>0) { state.selAllIdx = 0; document.getElementById('tick-label').textContent = DS.all[0].tick; }

  updateAll();
}

// =================== Rendering ===================
let cachedFiltered = [];

function updateAll() {
  cachedFiltered = filtered();
  renderList();
  updateRight();
}

const ROW_H = 24;

function renderList() {
  const el = document.getElementById('inst-list');
  const N = cachedFiltered.length;

  // One constant-height spacer holds absolutely-positioned rows.  The
  // spacer height only depends on N, so re-rendering the row window never
  // changes the container's total height or the content above the
  // viewport: there is nothing for the browser to anchor, clamp, or
  // re-scroll, which eliminates wheel snap-back, jitter and runaway
  // scrolling.  (overflow-anchor:none additionally disables anchoring.)
  let sp = el._spacer;
  if (!sp) {
    el.innerHTML = '';
    sp = document.createElement('div');
    sp.className = 'list-spacer';
    el.appendChild(sp);
    el._spacer = sp;
  }
  sp.style.height = (N * ROW_H) + 'px';

  if (N === 0) {
    sp.innerHTML = '<div style="color:#666;padding:20px;text-align:center;">No matching instructions</div>';
    return;
  }

  const st = el.scrollTop;
  const viewH = el.clientHeight || 600;
  const start = Math.max(0, Math.floor(st / ROW_H) - 10);
  const end = Math.min(N, Math.ceil((st + viewH) / ROW_H) + 10);

  const cur = selectedRec();
  let html = '';
  for (let i = start; i < end; i++) {
    const r = cachedFiltered[i];
    html += `<div class="inst-row${r === cur ? ' sel' : ''}" style="top:${i * ROW_H}px" data-i="${i}">` +
            `<span class="tick">${r.tick}</span>` +
            `<span class="seq">${r.fetch_seq ?? ''}</span><span class="core">${r.core ?? ''}</span>` +
            `<span class="pc">${r.pc||''}</span>` +
            `<span class="inst-name">${esc2(r.inst||'')}</span></div>`;
  }
  sp.innerHTML = html;
}

// Throttle re-renders to one per animation frame: rapid scroll events
// coalesce instead of rebuilding the row window every event.
let _renderRaf = 0;
document.getElementById('inst-list').addEventListener('scroll', () => {
  if (_renderRaf) return;
  _renderRaf = requestAnimationFrame(() => { _renderRaf = 0; renderList(); });
});
document.getElementById('inst-list').addEventListener('click', function(e) {
  if (e.target.closest('.prod')) return; // handled by onclick
  const row = e.target.closest('.inst-row'); if (!row) return;
  const i = parseInt(row.getAttribute('data-i'));
  if (i>=0 && i<cachedFiltered.length) {
    state.selAllIdx = DS.all.indexOf(cachedFiltered[i]);
    const r = cachedFiltered[i];
    document.getElementById('tick-slider').value = state.selAllIdx;
    document.getElementById('tick-label').textContent = r.tick;
    updateAll();
  }
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const f = filtered();
    const cur = selectedRec();
    const fi = cur ? f.indexOf(cur) : -1;
    const newFi = e.key === 'ArrowDown' ? Math.min(f.length-1, fi+1) : Math.max(0, fi-1);
    if (newFi >= 0 && newFi < f.length) {
      state.selAllIdx = DS.all.indexOf(f[newFi]);
      document.getElementById('tick-slider').value = state.selAllIdx;
      document.getElementById('tick-label').textContent = f[newFi].tick;
      updateAll();
    }
  }
});

// =================== Right Panel ===================
function updateRight() {
  const r = selectedRec();
  if (state.view === 'snapshot') { renderSnapshot(r); return; }
  renderDeps(r);
}

function renderDeps(rec) {
  const el = document.getElementById('right-content');
  if (!rec) { el.innerHTML = '<div style="color:#666;padding:20px;">Select an instruction</div>'; return; }

  const thisIdx = DS.all.indexOf(rec);
  let seqInfo = '';
  if (rec.fetch_seq !== undefined) seqInfo += ` FetchSeq: ${rec.fetch_seq}`;
  if (rec.cp_seq !== undefined) seqInfo += ` CPSeq: ${rec.cp_seq}`;
  let html = `<div style="margin-bottom:6px;"><b style="color:#888;">Dependencies @ tick ${rec.tick}</b><span style="color:#888;font-size:10px;margin-left:8px;">${seqInfo}</span></div>`;
  html += '<table id="dep-table">';

  // Source registers with producers
  if (rec.src && rec.src.length > 0) {
    for (let s of rec.src) {
      const p = DS.getProducerBefore(s.name, thisIdx, rec.thread);
      html += '<tr>';
      html += `<td class="dep-src">SRC</td><td class="dep-src">${s.name}</td>`;
      html += `<td class="dep-val">${fmtValBox(s.val, s.size)}</td>`;
      if (p) {
        const prod = DS.all[p.idx];
        html += `<td class="dep-prod" onclick="jumpToIdx(${p.idx})">← ${esc2(prod.inst)} @ tick ${prod.tick} <span style="font-size:9px;color:#8b93ab;">#${p.idx}</span><br><span style="font-size:9px;color:#888;">PC ${prod.pc}</span></td>`;
      } else {
        html += '<td class="dep-here">(uninit)</td>';
      }
      html += '</tr>';
    }
  }

  // Destination registers (written by this instruction)
  if (rec.dst && rec.dst.length > 0) {
    for (let d of rec.dst) {
      html += '<tr>';
      html += `<td class="dep-dst">DST</td><td class="dep-dst">${d.name}</td>`;
      html += `<td class="dep-val">${fmtValBox(d.val, d.size)}</td>`;
      html += '<td class="dep-here">this instruction</td>';
      html += '</tr>';
    }
  }

  // Memory access (if any)
  if (rec.mem && rec.mem.addr) {
    html += '<tr>';
    html += `<td class="dep-mem">MEM</td><td class="dep-mem">${rec.mem.addr}</td>`;
    html += `<td class="dep-val">+${rec.mem.size}B</td>`;
    html += '<td class="dep-here">this instruction</td>';
    html += '</tr>';
  }

  if ((!rec.src || rec.src.length === 0) && (!rec.dst || rec.dst.length === 0) &&
      !(rec.mem && rec.mem.addr)) {
    html += '<tr><td colspan="4" style="color:#666;">No register operands</td></tr>';
  }

  html += '</table>';
  el.innerHTML = html;
}

function renderSnapshot(rec) {
  const el = document.getElementById('right-content');
  const thisIdx = rec ? DS.all.indexOf(rec) : 0;
  const tick = rec ? rec.tick : 0;
  const vals = rec ? DS.snapshotAt(thisIdx, rec.thread) : new Map();
  const chg = rec ? {src: new Set((rec.src||[]).map(s=>s.name)), dst: new Set((rec.dst||[]).map(d=>d.name))} : {src:new Set(), dst:new Set()};

  let html = `<div style="margin-bottom:6px;">
    <b style="color:#888;">Registers @ tick ${tick}</b>
    <span style="margin-left:8px;font-size:10px;"><span style="color:#40a0ff;">src r/o</span> <span style="color:#ff6040;">dst w/o</span></span>
  </div>
  <div style="color:#555;font-size:9px;margin-bottom:4px;">仅供参考 — 仅含 trace 窗口内写入过的寄存器</div>`;
  html += '<div style="max-height:calc(100vh-170px);overflow:auto;"><table id="snap-table"><tr><th>Register</th><th>Value</th></tr>';

  const grps = new Map();
  for (let [n, v] of vals) { const p = n.split('[')[0]; if(!grps.has(p)) grps.set(p,[]); grps.get(p).push({n, v: v.val, size: v.size}); }
  for (let [p,regs] of grps) {
    regs.sort((a,b)=>(parseInt((a.n.match(/\[(\d+)/)||['','0'])[1])||0) - (parseInt((b.n.match(/\[(\d+)/)||['','0'])[1])||0));
    for (let x of regs) {
      let cls = chg.src.has(x.n) ? 'snap-src' : chg.dst.has(x.n) ? 'snap-dst' : '';
      html += `<tr class="${cls}"><td>${x.n}</td><td style="font-size:10px;">${snapValHtml(x.v, x.size)}</td></tr>`;
    }
  }
  html += '</table></div>';
  el.innerHTML = html;
}

// =================== Value formatting ===================
// Registers can be large (e.g. 256B vectors).  Values are shown as
// space-separated bytes (`00 01 02 ...`); long values are truncated to
// the first few bytes with a length annotation, and the detail panel
// exposes the full value in a scrollable box plus a copy button.
// The JSON itself always keeps the full value (raw "0x..." hex).

const MAX_INLINE_BYTES = 8;  // bytes shown inline in list rows

function hexToBytes(v) {
  if (typeof v !== 'string' || !v.startsWith('0x')) return null;
  return v.slice(2).match(/.{2}/g) || [];
}

function fmtVal(v, size) {
  const b = hexToBytes(v);
  if (!b) return v;
  if (b.length > MAX_INLINE_BYTES) {
    return b.slice(0, MAX_INLINE_BYTES).join(' ') + ' …(' + size + 'B)';
  }
  return b.join(' ');
}

// hexdump-style grid: offset column + 16 bytes per row, gap after byte 8
function gridOf(bytes) {
  const width = Math.max(4, Math.ceil(Math.log2(bytes.length) / 4));
  const pad = '0'.repeat(width);
  let out = '';
  for (let i = 0; i < bytes.length; i += 16) {
    const chunk = bytes.slice(i, i + 16);
    const lo = chunk.slice(0, 8).join(' ');
    const hi = chunk.slice(8).join(' ');
    const off = (pad + i.toString(16)).slice(-width);
    out += off + ': ' + lo + (chunk.length > 8 ? '  ' + hi : '') + '\n';
  }
  return out;
}

function fmtValBox(v, size) {
  const b = hexToBytes(v);
  if (!b) return v;
  if (b.length > MAX_INLINE_BYTES) {
    return `<div class="dep-val-box mono">${gridOf(b)}</div>` +
           `<button class="copy-btn" data-val="${v}" onclick="copyVal(this)" title="copy raw hex value">copy</button>`;
  }
  return `<span class="mono">${b.join(' ')}</span>`;
}

function copyVal(btn) {
  const v = btn.dataset.val || '';
  const done = () => { btn.textContent = '✓'; setTimeout(() => btn.textContent = 'copy', 800); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).then(done).catch(() => fallbackCopy(v, done));
  } else {
    fallbackCopy(v, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}

// Snapshot value cell: long registers show a truncated value with an
// expand caret; clicking toggles an inline hexdump grid + copy button.
function snapValHtml(v, size) {
  const b = hexToBytes(v);
  if (!b) return v;
  if (b.length <= MAX_INLINE_BYTES) return `<span class="mono">${b.join(' ')}</span>`;
  return `<span class="snap-toggle" data-val="${v}" data-size="${size}" data-expanded="0" onclick="toggleSnapVal(this)">${fmtVal(v, size)} <span class="snap-caret">&#9656;</span></span>`;
}

function toggleSnapVal(el) {
  const size = parseInt(el.dataset.size) || 0;
  if (el.dataset.expanded === '1') {
    el.innerHTML = fmtVal(el.dataset.val, size) + ' <span class="snap-caret">&#9656;</span>';
    el.dataset.expanded = '0';
  } else {
    const b = hexToBytes(el.dataset.val) || [];
    el.innerHTML = `<div class="dep-val-box mono">${gridOf(b)}</div>` +
                   `<button class="copy-btn" data-val="${el.dataset.val}" onclick="event.stopPropagation();copyVal(this)">copy</button>`;
    el.dataset.expanded = '1';
  }
}

// =================== Controls ===================
document.getElementById('file-inp').addEventListener('change', e => {
  if (e.target.files.length) loadFile(e.target.files[0]);
});

document.getElementById('thread-sel').addEventListener('change',e=>{ state.thread=e.target.value; updateAll(); });
document.getElementById('search-box').addEventListener('input',e=>{ state.filter=e.target.value; updateAll(); });
document.getElementById('tick-slider').addEventListener('input',e=>{
  const i=parseInt(e.target.value);
  if (i>=0 && i<DS.all.length) { state.selAllIdx = i;
    document.getElementById('tick-label').textContent = DS.all[i].tick;
    updateAll(); }
});

document.getElementById('btn-prev').addEventListener('click',()=>{
  const f = filtered(); const cur = selectedRec();
  const fi = cur ? f.indexOf(cur) : -1;
  const prev = fi > 0 ? f[fi-1] : f[0];
  if (prev) { state.selAllIdx = DS.all.indexOf(prev);
    document.getElementById('tick-slider').value = state.selAllIdx;
    document.getElementById('tick-label').textContent = prev.tick;
    updateAll(); }
});
document.getElementById('btn-next').addEventListener('click',()=>{
  const f = filtered(); const cur = selectedRec();
  const fi = cur ? f.indexOf(cur) : -1;
  const next = fi >= 0 && fi < f.length-1 ? f[fi+1] : f[f.length-1];
  if (next) { state.selAllIdx = DS.all.indexOf(next);
    document.getElementById('tick-slider').value = state.selAllIdx;
    document.getElementById('tick-label').textContent = next.tick;
    updateAll(); }
});

document.getElementById('right-tabs').addEventListener('click',e=>{
  if (e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active'); state.view=e.target.dataset.view; updateAll();
});

// Drag & drop
let dz = document.getElementById('drop-zone');
document.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('show'); });
document.addEventListener('dragleave',e=>{ if(e.target===document.documentElement||e.target===dz) dz.classList.remove('show'); });
document.addEventListener('drop',e=>{ e.preventDefault(); dz.classList.remove('show');
  if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });

window.addEventListener('resize',()=>{ renderList(); });

function esc2(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
